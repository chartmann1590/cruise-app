name: Build Release (AAB + APK)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore google-services.json
        env:
          GOOGLE_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_B64" ]; then
            echo "$GOOGLE_B64" | base64 -d > app/google-services.json
            echo "google-services.json restored from secret"
          else
            echo "No GOOGLE_SERVICES_JSON_B64 secret — using example (test build)"
            cp app/google-services.json.example app/google-services.json
          fi
          ls -l app/google-services.json

      - name: Restore admob.properties
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          if [ -n "$ADMOB_APP_ID" ] && [ -n "$ADMOB_BANNER_ID" ] && [ -n "$ADMOB_INTERSTITIAL_ID" ]; then
            printf "ADMOB_APP_ID=%s\nADMOB_BANNER_ID=%s\nADMOB_INTERSTITIAL_ID=%s\n" \
              "$ADMOB_APP_ID" "$ADMOB_BANNER_ID" "$ADMOB_INTERSTITIAL_ID" > app/admob.properties
            echo "admob.properties restored from secrets (real IDs, not logged)"
            wc -l app/admob.properties
          else
            echo "No AdMob secrets — build will use Google test IDs (debug/test only)"
          fi

      - name: Restore upload keystore + keystore.properties
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KP_B64: ${{ secrets.KEYSTORE_PROPERTIES_B64 }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KP_B64" ]; then
            echo "$KS_B64" | base64 -d > app/upload-keystore.jks
            echo "$KP_B64" | base64 -d > app/keystore.properties
            echo "Keystore restored: $(wc -c < app/upload-keystore.jks) bytes, properties $(wc -l < app/keystore.properties) lines"
          else
            echo "No keystore secrets — release will be unsigned (CI test build only)"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Play icon / feature graphic / promo
        run: |
          echo "Checking Play Store assets..."
          test -f fastlane/metadata/android/en-US/images/icon.png && echo "✓ icon.png 512x512" || (echo "✗ missing icon.png"; exit 1)
          test -f fastlane/metadata/android/en-US/images/featureGraphic.png && echo "✓ featureGraphic.png 1024x500" || (echo "✗ missing featureGraphic.png"; exit 1)
          test -f public/promo.mp4 && echo "✓ promo.mp4 $(du -h public/promo.mp4 | cut -f1)" || echo "⚠ promo.mp4 missing (upload YouTube URL manually)"
          ls -l fastlane/metadata/android/en-US/images/phoneScreenshots/ | head -20
          echo "--- Data safety & listing ---"
          test -f play-store/DATA_SAFETY.md && echo "✓ DATA_SAFETY.md"
          test -f fastlane/metadata/android/en-US/full_description.txt && echo "✓ full_description.txt"
          test -f fastlane/metadata/android/en-US/short_description.txt && echo "✓ short_description.txt"
          test -f fastlane/metadata/android/en-US/title.txt && echo "✓ title.txt"

      - name: Build Debug APK (always)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB (signed if keystore present)
        run: |
          if [ -f app/keystore.properties ] && [ -f app/upload-keystore.jks ]; then
            echo "Signing config present — building signed release"
            ./gradlew bundleRelease --stacktrace
          else
            echo "No signing config — building unsigned release for verification (will fail verifyPlayReleaseConfiguration if AdMob test IDs)"
            ./gradlew bundleRelease --stacktrace || echo "Release build failed as expected without prod config — debug build succeeded"
          fi

      - name: Verify release bundle
        if: hashFiles('app/build/outputs/bundle/release/app-release.aab') != ''
        run: |
          ls -lh app/build/outputs/bundle/release/
          echo "AAB size: $(du -h app/build/outputs/bundle/release/app-release.aab | cut -f1)"
          # Basic bundle inspection (requires bundletool if available)
          if command -v bundletool >/dev/null 2>&1; then bundletool dump manifest --bundle app/build/outputs/bundle/release/app-release.aab | head -30; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cruise-loom-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            public/promo.mp4
            promo/subs.srt
          if-no-files-found: warn
          retention-days: 14

  # Optional: deploy to Firebase Hosting on push to main (public site)
  hosting:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: cruise-app-2026
        continue-on-error: true
