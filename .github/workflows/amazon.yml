name: Amazon Appstore build + emulator test
# Amazon Appstore (Fire) build of this app: same code, built with -Pstore=amazon (no Google Play
# links, no Play in-app review prompt). Run on a tablet-size emulator without Google Play
# services (like Fire). Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Restore google-services.json
      env:
        GOOGLE_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      run: |
        if [ -n "$GOOGLE_B64" ]; then
          echo "$GOOGLE_B64" | base64 -d > app/google-services.json
          echo "google-services.json restored from secret"
        else
          echo "No GOOGLE_SERVICES_JSON_B64 secret — using example (test build)"
          cp app/google-services.json.example app/google-services.json
        fi
        ls -l app/google-services.json
    - name: Restore admob.properties
      env:
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      run: |
        if [ -n "$ADMOB_APP_ID" ] && [ -n "$ADMOB_BANNER_ID" ] && [ -n "$ADMOB_INTERSTITIAL_ID" ]; then
          printf "ADMOB_APP_ID=%s\nADMOB_BANNER_ID=%s\nADMOB_INTERSTITIAL_ID=%s\n" \
            "$ADMOB_APP_ID" "$ADMOB_BANNER_ID" "$ADMOB_INTERSTITIAL_ID" > app/admob.properties
          echo "admob.properties restored from secrets (real IDs, not logged)"
          wc -l app/admob.properties
        else
          echo "No AdMob secrets — build will use Google test IDs (debug/test only)"
        fi
    - name: Restore upload keystore + keystore.properties
      env:
        KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KP_B64: ${{ secrets.KEYSTORE_PROPERTIES_B64 }}
      run: |
        if [ -n "$KS_B64" ] && [ -n "$KP_B64" ]; then
          echo "$KS_B64" | base64 -d > app/upload-keystore.jks
          echo "$KP_B64" | base64 -d > app/keystore.properties
          echo "Keystore restored: $(wc -c < app/upload-keystore.jks) bytes, properties $(wc -l < app/keystore.properties) lines"
        else
          echo "No keystore secrets — release will be unsigned (CI test build only)"
        fi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build amazon APK (store=amazon)
      run: |
        set -o pipefail
        ./gradlew --no-daemon assembleRelease -Pstore=amazon --stacktrace 2>&1 | tee -a /tmp/amz-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p amz-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" amz-apk/CruiseLoom-amazon-release.apk
        ls -la amz-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs amz-apk/CruiseLoom-amazon-release.apk | head -3 || true
        $BT/aapt2 dump badging amz-apk/CruiseLoom-amazon-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the amazon release dex:"; unzip -p amz-apk/CruiseLoom-amazon-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (no Google Play services, like Fire)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_CruiseLoom_r${{ github.run_number }}
    - name: Draft release with the amazon APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: amz-apk/CruiseLoom-amazon-release.apk
